[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "crates/magic", "crates/samples"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Copies of crates with fixes of ours, each marked "Qubero:" in the source:
# pure-magic in src/parser.rs, yaxpeax-x86 in src/long_mode/mod.rs.
# Take a fix out once it is upstream.
[patch.crates-io]
pure-magic = { path = "crates/vendor/pure-magic" }
yaxpeax-x86 = { path = "crates/vendor/yaxpeax-x86" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
