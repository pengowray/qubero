[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "crates/magic", "crates/samples"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# A copy of the crate with one fix in src/parser.rs (search for "Qubero:").
# Take the fix out once it is upstream.
[patch.crates-io]
pure-magic = { path = "crates/vendor/pure-magic" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
