[package]
name = "qubero-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dev-dependencies]
proptest = "1"
# What the decoders in `codec` are checked against. Our own inflater and LZ4
# reader exist for the trace, not for the bytes: the bytes have to be the same
# bytes these give, over the whole sample collection and over random data at
# every level.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }
# The bzip2 encoder the tests compress with, since nothing that ships writes
# one. Default features are `libbz2-rs-sys`, the pure-Rust port of the C
# library, so this needs no C toolchain either. A second implementation of the
# format as well as an encoder: what it writes is what `bzip2-rs` has to read.
bzip2 = "0.6.1"

[dependencies]
# Hashing a path of child indices happens several times per field; the default
# hasher is built to resist collision attacks the memo has no exposure to.
rustc-hash = "2"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "hybrid", "perf-literal"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# Machine code decoders, for the executable sections of a program. Default
# features drag in serde and a terminal colour library; a decoder and the text
# it formats are all this needs.
yaxpeax-arch = { version = "0.3.2", default-features = false, features = ["std"] }
yaxpeax-x86 = { version = "2.2.0", default-features = false, features = ["std", "fmt"] }
yaxpeax-arm = { version = "0.4.0", default-features = false, features = ["std", "fmt"] }
raki = "1.3.2"
# Zstandard, pure Rust and no C. Default features off: what is left out is a
# checksum of the decompressed data, which this does not check.
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
# One LZ4 block. Default features off leaves out the frame reader, which the
# lz4 template already reads itself, and keeps the checked decoder rather than
# the one that trusts its input: this reads files nobody vouched for.
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }
# xz, pure Rust. It reads a whole stream rather than a block: the LZMA2 inside
# one xz block is a step of a decoder's state and does not stand on its own,
# which is why the template opens the stream and not the block.
lzma-rs = { version = "0.3", default-features = false }
# bzip2, pure Rust. It takes a whole stream and gives bytes: bzip2 packs its
# blocks to the bit, so a block is not a run anything else can address and the
# stream is the unit. Decoding only, which is the half of the format that ships,
# and it forbids unsafe outright, which matters for something reading files
# nobody vouched for. The `bzip2` crate with `libbz2-rs-sys` also builds for
# wasm32 and is the better maintained of the two, but it is a port of the C
# library, pointers and all, and carries an encoder this never calls; that one
# is the dev-dependency here instead, so the two are checked against each other.
# The default features are the empty set; the `rustc_*` ones only tell its own
# dependencies which language version to assume.
bzip2-rs = { version = "0.1.2", default-features = false }
