[package]
name = "qubero-magic"
edition.workspace = true
version.workspace = true
license = "MIT AND BSD-2-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pure-magic = "0.3"
magic-db = { version = "0.5", features = ["global"] }
