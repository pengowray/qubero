[package]
name = "qubero-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# Where the sample collection is; see the note in `crates/core/Cargo.toml`.
qubero-samples = { path = "../samples" }

[dependencies]
qubero-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
